name: EKS platform (vpc -> eks -> components)

on:
  push:
    branches: [main]
    paths:
      - "vpc/**"
      - "eks/**"
      - "components/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "vpc/**"
      - "eks/**"
      - "components/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      region:
        description: "AWS region"
        default: eu-west-2
      cluster_name:
        description: "EKS cluster name"
        default: platform-eks

concurrency:
  group: eks-platform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # push -> apply, pull_request -> plan, manual -> chosen action
  config:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.c.outputs.action }}
      region: ${{ steps.c.outputs.region }}
      cluster_name: ${{ steps.c.outputs.cluster_name }}
    steps:
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          IN_ACTION: ${{ inputs.action }}
          IN_REGION: ${{ inputs.region }}
          IN_CLUSTER: ${{ inputs.cluster_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then ACTION=plan; else ACTION="${IN_ACTION:-apply}"; fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "region=${IN_REGION:-eu-west-2}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${IN_CLUSTER:-platform-eks}" >> "$GITHUB_OUTPUT"

  # ---------- Build order: bootstrap -> vpc -> eks -> components -> verify ----------
  bootstrap:
    needs: config
    if: needs.config.outputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.config.outputs.region }}
      - run: ./scripts/bootstrap-state.sh
        env:
          AWS_REGION: ${{ needs.config.outputs.region }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  vpc:
    needs: [config, bootstrap]
    if: needs.config.outputs.action != 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: vpc
      state_key: vpc/terraform.tfstate
      action: ${{ needs.config.outputs.action }}
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}

  eks:
    needs: [config, vpc]
    if: needs.config.outputs.action != 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: eks
      state_key: eks/terraform.tfstate
      action: ${{ needs.config.outputs.action }}
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}
      verify_cluster: true

  components:
    needs: [config, eks]
    if: needs.config.outputs.action != 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: components
      state_key: components/terraform.tfstate
      action: ${{ needs.config.outputs.action }}
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}

  verify:
    needs: [config, components]
    if: needs.config.outputs.action == 'apply'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ needs.config.outputs.region }}
      CLUSTER_NAME: ${{ needs.config.outputs.cluster_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.config.outputs.region }}
      - run: ./scripts/verify-cluster.sh
      - run: ./scripts/verify-components.sh

  # ---------- Destroy (manual only), reverse order ----------
  destroy-components:
    needs: config
    if: needs.config.outputs.action == 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: components
      state_key: components/terraform.tfstate
      action: destroy
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}

  destroy-eks:
    needs: [config, destroy-components]
    if: needs.config.outputs.action == 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: eks
      state_key: eks/terraform.tfstate
      action: destroy
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}

  destroy-vpc:
    needs: [config, destroy-eks]
    if: needs.config.outputs.action == 'destroy'
    uses: ./.github/workflows/terraform-layer.yml
    secrets: inherit
    with:
      working_dir: vpc
      state_key: vpc/terraform.tfstate
      action: destroy
      region: ${{ needs.config.outputs.region }}
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      cluster_name: ${{ needs.config.outputs.cluster_name }}